version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tax_db
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-wellness_orders}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tax_redis
    ports:
      - "6379:6379"
    networks:
      - backend_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: tax_backend
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - backend_network
      - proxy_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tax_frontend
    env_file: .env
    depends_on:
      - backend
    networks:
      - proxy_network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tax_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy_network
    depends_on:
      - frontend
      - backend

networks:
  backend_network:
  proxy_network:


volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
