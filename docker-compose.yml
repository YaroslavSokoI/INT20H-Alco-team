version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tax_db
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tax_backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
    container_name: tax_frontend
    ports:
      - "127.0.0.1:5173:5173"
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
